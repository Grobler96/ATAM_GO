<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATAM GO — Overdue Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3" integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+" crossorigin="anonymous"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at top left, rgba(239,68,68,0.10), transparent 32%),
                radial-gradient(circle at top right, rgba(56,189,248,0.08), transparent 30%),
                linear-gradient(135deg, #020617 0%, #0f172a 45%, #020617 100%);
    color: #f8fafc;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .wrap { display: flex; flex-direction: column; height: 100vh; padding: 28px 40px; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 18px; }
  .header-left img { height: 48px; background: rgba(255,255,255,0.92); padding: 6px; border-radius: 10px; }
  .header-title { font-size: 13px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; color: #f87171; margin: 0; }
  .header-title span { color: #94a3b8; font-weight: 700; letter-spacing: 0.06em; margin-left: 10px; }
  .clock { font-size: 22px; font-weight: 800; color: #cbd5e1; font-variant-numeric: tabular-nums; }

  .summary-bar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; flex-shrink: 0;
  }
  .summary-card {
    border-radius: 20px; padding: 18px 22px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(15,23,42,0.82); backdrop-filter: blur(18px);
    box-shadow: 0 22px 60px rgba(0,0,0,0.35);
  }
  .summary-card span { display: block; color: #94a3b8; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .summary-card strong { display: block; font-size: 34px; font-weight: 900; letter-spacing: -0.03em; }
  .summary-card.danger strong { color: #f87171; }
  .summary-card.amber strong { color: #fbbf24; }

  /* ── Card grid, matching dispatch.js card structure ── */
  .card-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .card-grid {
    flex: 1; overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 22px;
    padding: 4px 6px 20px 2px;
  }

  .order-card {
    position: relative;
    background: #0d1525;
    border: 1px solid rgba(239,68,68,0.35);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: visible;
    /* Red glow behind the card — the main ask */
    box-shadow:
      0 0 0 1px rgba(239,68,68,0.15),
      0 0 34px 6px rgba(239,68,68,0.35),
      0 0 70px 14px rgba(239,68,68,0.16);
    animation: glow-pulse 2.6s ease-in-out infinite;
  }
  .order-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    border-radius: 14px 0 0 14px;
    background: #ef4444;
  }
  @keyframes glow-pulse {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(239,68,68,0.15),
        0 0 34px 6px rgba(239,68,68,0.35),
        0 0 70px 14px rgba(239,68,68,0.16);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(239,68,68,0.22),
        0 0 46px 10px rgba(239,68,68,0.5),
        0 0 90px 20px rgba(239,68,68,0.24);
    }
  }

  .oc-header { display: flex; align-items: center; justify-content: space-between; }
  .oc-order-id { font-size: 19px; font-weight: 800; color: #e8edf5; letter-spacing: -0.5px; }
  .oc-hash { color: #64748b; font-weight: 400; }
  .oc-urgency-dot {
    width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    background: #ef4444; box-shadow: 0 0 6px #ef4444;
    animation: pulse-red-dot 1s infinite;
  }
  @keyframes pulse-red-dot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
  }

  .oc-customer { font-size: 16px; font-weight: 700; color: #f8fafc; line-height: 1.2; }
  .oc-store { font-size: 12px; color: #64748b; margin-top: -8px; }

  .oc-meta-row { display: flex; gap: 16px; }
  .oc-meta-item { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .oc-meta-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #64748b; }
  .oc-meta-val { font-size: 14px; color: #cbd5e1; }
  .oc-meta-val strong { color: #f8fafc; }

  .oc-countdown {
    font-size: 14px; font-weight: 800; color: #fca5a5;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; padding: 9px 12px; text-align: center;
    font-variant-numeric: tabular-nums;
    animation: flicker 1.6s ease-in-out infinite;
  }
  .oc-countdown.today { color: #fde68a; background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); }
  @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }

  .oc-actions { display: flex; gap: 8px; }
  .oc-btn {
    flex: 1; border: none; border-radius: 8px; padding: 9px 10px;
    font-size: 12px; font-weight: 800; letter-spacing: 0.02em;
    cursor: pointer; transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .oc-btn:active { transform: scale(0.97); }
  .oc-btn:disabled { opacity: 0.5; cursor: default; }
  .oc-btn-done { background: #16a34a; color: #f0fdf4; }
  .oc-btn-done:hover:not(:disabled) { background: #15803d; }
  .oc-btn-hide { background: rgba(255,255,255,0.08); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.14); }
  .oc-btn-hide:hover:not(:disabled) { background: rgba(255,255,255,0.14); }

  /* Notes on an overdue order (v95) */
  .oc-note-wrap { display: flex; flex-direction: column; gap: 6px; }
  .oc-note {
    background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.28);
    border-radius: 8px; padding: 9px 12px; color: #e0f2fe; font-size: 13px; line-height: 1.35;
    white-space: pre-wrap; word-break: break-word;
  }
  .oc-note-meta { color: #7dd3fc; font-size: 11px; margin-top: 5px; white-space: normal; opacity: 0.85; }
  .oc-note-link {
    align-self: flex-start; background: none; border: none; padding: 2px 0; cursor: pointer;
    color: #7dd3fc; font-size: 12px; font-weight: 700; text-decoration: underline; text-underline-offset: 2px;
  }
  .oc-note-link:hover { color: #bae6fd; }
  .oc-note-box { width: 100%; min-height: 62px; resize: vertical; border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px;
    background: #0b1220; color: #f8fafc; border: 1px solid rgba(56,189,248,0.5); }
  .oc-note-row { display: flex; align-items: center; gap: 8px; }
  .oc-note-row .oc-btn { flex: 0 0 auto; padding: 7px 14px; }
  .oc-note-count { margin-left: auto; color: #64748b; font-size: 11px; }
  .oc-btn-save { background: #0284c7; color: #f0f9ff; }
  .oc-btn-save:hover:not(:disabled) { background: #0369a1; }
  .oc-note-err { color: #fca5a5; font-size: 12px; }
  /* Refresh button (v95) */
  .header-right { display: flex; align-items: center; gap: 16px; }
  .refresh-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .refresh-btn {
    background: rgba(56,189,248,0.12); color: #bae6fd; border: 1px solid rgba(56,189,248,0.4); border-radius: 10px;
    padding: 9px 16px; font-size: 13px; font-weight: 800; cursor: pointer; letter-spacing: 0.02em;
  }
  .refresh-btn:hover:not(:disabled) { background: rgba(56,189,248,0.22); }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  .refresh-info { color: #64748b; font-size: 11px; text-align: right; max-width: 460px; }
  .card-fading { animation: card-fade-out 0.35s ease forwards; }
  @keyframes card-fade-out { to { opacity: 0; transform: scale(0.96); } }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #4ade80; gap: 14px;
  }
  .empty-state .big { font-size: 64px; }
  .empty-state .msg { font-size: 26px; font-weight: 800; }

  .footer { margin-top: 16px; text-align: right; color: #475569; font-size: 12px; flex-shrink: 0; }
</style>
</head>
<body>

<script>
  // Session check — same pattern as index.html. Kiosk browsers stay signed in
  // via Supabase's persisted session, so this only needs logging in once.
  (async () => {
    const cfg = window.ATAM_GO_CONFIG || {};
    const _sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const { data: { session } } = await _sb.auth.getSession();
    if (!session) window.location.replace('./login.html');
  })();
</script>

<div class="wrap">
  <div class="header">
    <div class="header-left">
      <img src="atam-go-logo.png?v=4" alt="ATAM GO logo" />
      <p class="header-title">Overdue Orders <span id="dateLabel"></span></p>
    </div>
    <div class="header-right">
      <div class="refresh-wrap">
        <button type="button" class="refresh-btn" id="refreshBtn">&#8635; Refresh from DecoNetwork</button>
        <div class="refresh-info" id="refreshInfo"></div>
      </div>
      <div class="clock" id="clock">--:--</div>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-card danger">
      <span>Overdue Orders</span>
      <strong id="overdueCount">—</strong>
    </div>
    <div class="summary-card amber">
      <span>Total Units Overdue</span>
      <strong id="overdueUnits">—</strong>
    </div>
  </div>

  <div class="card-panel">
    <div class="card-grid" id="cardGrid"></div>
  </div>

  <div class="footer" id="lastRefreshed"></div>
</div>

<script>
(function () {
  'use strict';

  const cfg = window.ATAM_GO_CONFIG || {};
  const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  const REFRESH_MS = 60 * 1000; // matches dispatch page's refresh cadence

  const $ = id => document.getElementById(id);

  function esc(v) {
    return String(v == null ? '' : v)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
  }
  function num(v) { return new Intl.NumberFormat('en-GB').format(Number(v || 0)); }
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

  function fmtDate(v) {
    return v ? new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: '2-digit', month: 'short' }).format(new Date(v)) : '—';
  }
  function fmtTime(v) {
    return v ? new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' }).format(new Date(v)) : '';
  }

  function updateClock() {
    const now = new Date();
    $('clock').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    $('dateLabel').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // Same overdue-by text style as the dispatch page's countdown chip
  function overdueText(dueDate, today) {
    const due = startOfDay(dueDate);
    if (due.getTime() === today.getTime()) return { text: '⚠️ Due today', isToday: true };
    const overByMs = today - due;
    const days = Math.floor(overByMs / 86400000);
    return { text: `⚠️ Overdue by ${days} day${days === 1 ? '' : 's'}`, isToday: false };
  }

  const STATUS_MAP = {
    1: 'Quote', 2: 'Production Complete', 3: 'Shipped', 4: 'Cancelled',
    5: 'On Hold', 6: 'Awaiting Stock', 7: 'Awaiting Artwork',
    8: 'In Production', 9: 'Awaiting Payment'
  };

  // Notes (v95): one short note per order, saved in order_notes (not in upcoming_orders, so the DecoNetwork refresh never wipes it).
  let notes = {};
  let lastSynced = null;   // newest synced_at among the orders on screen = when DecoNetwork was last pulled into GO
  function fmtStamp(v) {
    return v ? new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(v)) : '';
  }
  function noteHtml(orderId) {
    const n = notes[orderId];
    if (!n) return `<button type="button" class="oc-note-link" data-note="edit" data-order-id="${esc(orderId)}">+ Add a note (why is it late?)</button>`;
    return `<div class="oc-note">${esc(n.note)}<div class="oc-note-meta">${esc(n.updated_by || '')}${n.updated_by ? ' &middot; ' : ''}${esc(fmtStamp(n.updated_at))}</div></div>
            <button type="button" class="oc-note-link" data-note="edit" data-order-id="${esc(orderId)}">Edit note</button>`;
  }
  function editingNow() { return !!document.querySelector('.oc-note-box'); }
  async function loadNotes(ids) {
    notes = {};
    if (!ids.length) return;
    try {
      const { data, error } = await sb.from('order_notes').select('order_id, note, updated_by, updated_at').in('order_id', ids);
      if (error) throw error;
      (data || []).forEach(n => { notes[n.order_id] = n; });
    } catch (e) { console.error('Notes load failed:', e); }
  }
  function openNoteEditor(wrap) {
    const orderId = wrap.dataset.orderId;
    const cur = notes[orderId] ? notes[orderId].note : '';
    wrap.innerHTML = `<textarea class="oc-note-box" maxlength="300" placeholder="Why is it late? Keep it short, for example: waiting for the customer to approve artwork">${esc(cur)}</textarea>
      <div class="oc-note-row">
        <button type="button" class="oc-btn oc-btn-save" data-note="save" data-order-id="${esc(orderId)}">Save</button>
        <button type="button" class="oc-btn oc-btn-hide" data-note="cancel" data-order-id="${esc(orderId)}">Cancel</button>
        <span class="oc-note-count"></span>
      </div><div class="oc-note-err"></div>`;
    const box = wrap.querySelector('.oc-note-box');
    const count = wrap.querySelector('.oc-note-count');
    const upd = () => { count.textContent = box.value.length + '/300'; };
    box.addEventListener('input', upd); upd(); box.focus();
  }
  async function saveNote(wrap) {
    const orderId = wrap.dataset.orderId;
    const box = wrap.querySelector('.oc-note-box');
    const errEl = wrap.querySelector('.oc-note-err');
    const btns = wrap.querySelectorAll('.oc-btn');
    btns.forEach(b => b.disabled = true);
    try {
      const { data, error } = await sb.rpc('set_order_note', { p_order_id: String(orderId), p_note: box.value });
      if (error) throw error;
      if (data && data.note) notes[orderId] = { order_id: orderId, note: data.note, updated_by: data.updated_by, updated_at: data.updated_at };
      else delete notes[orderId];
      wrap.innerHTML = noteHtml(orderId);
    } catch (e) {
      console.error('Note save failed:', e);
      btns.forEach(b => b.disabled = false);
      errEl.textContent = 'Could not save the note. Check your connection and try again.';
    }
  }

  // Refresh from DecoNetwork (v95). The hourly automatic refresh is unchanged; this button pulls the latest orders on demand, so the
  // page can stay on the hourly setting and keep the number of automatic runs down.
  const WEBHOOK = (cfg.WEBHOOKS || {}).refreshOrders;
  function showRefreshInfo() {
    $('refreshInfo').textContent = lastSynced
      ? 'Orders last pulled from DecoNetwork at ' + fmtTime(lastSynced) + ' (automatic every hour)'
      : 'Orders are pulled from DecoNetwork automatically every hour';
  }
  async function refreshNow() {
    const btn = $('refreshBtn');
    if (!WEBHOOK) { $('refreshInfo').textContent = 'The refresh is not set up yet.'; return; }
    if (editingNow()) { $('refreshInfo').textContent = 'Finish or cancel the note you are writing first, then refresh.'; return; }
    // Already pulled in the last 2 minutes: just reload what is saved instead of asking DecoNetwork again.
    if (lastSynced && Date.now() - new Date(lastSynced).getTime() < 2 * 60 * 1000) {
      await load();
      $('refreshInfo').textContent = 'Already up to date (pulled at ' + fmtTime(lastSynced) + ')';
      return;
    }
    btn.disabled = true;
    const label = btn.innerHTML;
    btn.textContent = 'Refreshing…';
    $('refreshInfo').textContent = 'Asking DecoNetwork for the latest orders. This takes up to a minute.';
    let ok = false;
    try {
      const { data: { session } } = await sb.auth.getSession();
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 110000);
      const res = await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (session ? session.access_token : '') },
        body: JSON.stringify({ action: 'refreshOrders', source: 'ATAM GO overdue' }),
        signal: ctl.signal
      });
      clearTimeout(timer);
      ok = res.ok;
    } catch (e) { console.error('Refresh failed:', e); }
    await load();
    if (!ok) $('refreshInfo').textContent = 'Could not refresh from DecoNetwork just now, so this is the latest saved data (pulled at ' + (lastSynced ? fmtTime(lastSynced) : '?') + ').';
    setTimeout(() => { btn.disabled = false; btn.innerHTML = label; }, 15000);
    btn.innerHTML = label;
  }
  $('refreshBtn').addEventListener('click', refreshNow);

  async function load() {
    // Do not redraw the cards while someone is typing a note (a redraw would lose what they typed).
    if (editingNow()) return;
    try {
      // upcoming_orders pulls every order regardless of production status —
      // unlike late_or_at_risk_orders (built on decoration_records), it also
      // catches orders that are overdue before any production work has even
      // started (e.g. still "Awaiting Payment" or "Quote"), which decoration
      // records never gets a row for.
      const { data, error } = await sb
        .from('upcoming_orders')
        .select('*')
        .is('date_shipped', null)
        .is('dismissed_at', null)
        .order('date_due', { ascending: true, nullsFirst: false })
        .limit(200);

      if (error) throw error;

      const today = startOfDay(new Date());

      // Any unshipped order whose due date is today or earlier is overdue —
      // a genuine backlog, not just a one-day carry-over. An order that
      // missed Friday's ship date and is still sitting untouched will keep
      // showing here every day (Sat, Sun, Mon, ...) until it's shipped,
      // however long that takes.
      const overdue = (data || [])
        .filter(r => {
          if (!r.date_due) return false;
          const due = startOfDay(r.date_due);
          return due.getTime() <= today.getTime();
        })
        .sort((a, b) => new Date(a.date_due) - new Date(b.date_due));

      lastSynced = (data || []).reduce((m, r) => (r.synced_at && (!m || r.synced_at > m)) ? r.synced_at : m, null);
      await loadNotes(overdue.map(r => String(r.order_id)));
      if (editingNow()) return;
      render(overdue, today);
      showRefreshInfo();
      $('lastRefreshed').textContent = 'Last updated: ' + new Date().toLocaleTimeString('en-GB');
    } catch (e) {
      console.error('Overdue load failed:', e);
      $('cardGrid').innerHTML = `<div class="empty-state"><div class="big">⚠️</div><div class="msg">Could not load data</div></div>`;
    }
  }

  function render(rows, today) {
    const totalUnits = rows.reduce((s, r) => s + Number(r.total_quantity || 0), 0);
    $('overdueCount').textContent = num(rows.length);
    $('overdueUnits').textContent = num(totalUnits);

    const grid = $('cardGrid');

    if (rows.length === 0) {
      grid.innerHTML = `<div class="empty-state"><div class="big">✅</div><div class="msg">Nothing overdue right now</div></div>`;
      return;
    }

    grid.innerHTML = rows.map(r => {
      const overdue = overdueText(r.date_due, today);
      return `
        <div class="order-card" data-order-id="${esc(r.order_id)}">
          <div class="oc-header">
            <div class="oc-order-id"><span class="oc-hash">#</span>${esc(r.order_id)}</div>
            <div class="oc-urgency-dot"></div>
          </div>

          <div class="oc-customer">${esc(r.customer_name || 'Unknown')}</div>
          ${r.store_name ? `<div class="oc-store">${esc(r.store_name)}</div>` : ''}

          <div class="oc-meta-row">
            <div class="oc-meta-item">
              <span class="oc-meta-label">Due</span>
              <span class="oc-meta-val"><strong>${fmtDate(r.date_due)}</strong> ${fmtTime(r.date_due)}</span>
            </div>
            <div class="oc-meta-item">
              <span class="oc-meta-label">Qty</span>
              <span class="oc-meta-val"><strong>${num(r.total_quantity)}</strong> items</span>
            </div>
          </div>

          <div class="oc-meta-row">
            <div class="oc-meta-item">
              <span class="oc-meta-label">Assigned</span>
              <span class="oc-meta-val">${esc(r.assigned_to || 'Unassigned')}</span>
            </div>
            <div class="oc-meta-item">
              <span class="oc-meta-label">Status</span>
              <span class="oc-meta-val">${esc(STATUS_MAP[r.order_status] || `Status ${r.order_status}`)}</span>
            </div>
          </div>

          <div class="oc-countdown ${overdue.isToday ? 'today' : ''}">${overdue.text}</div>
          <div class="oc-note-wrap" data-order-id="${esc(r.order_id)}">${noteHtml(String(r.order_id))}</div>

          <div class="oc-actions">
            <button class="oc-btn oc-btn-done" data-action="confirmed_done" data-order-id="${esc(r.order_id)}">✔ Confirm Done</button>
            <button class="oc-btn oc-btn-hide" data-action="hidden" data-order-id="${esc(r.order_id)}">Hide</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Marks an order as manually resolved (shipped-but-not-yet-synced, or just
  // not something we want cluttering the board) so it drops off this page
  // for everyone, immediately, without waiting on the hourly DecoNetwork sync.
  async function dismissOrder(orderId, reason, cardEl) {
    const buttons = cardEl.querySelectorAll('.oc-btn');
    buttons.forEach(b => b.disabled = true);

    try {
      const { error } = await sb
        .from('upcoming_orders')
        .update({ dismissed_at: new Date().toISOString(), dismissed_reason: reason })
        .eq('order_id', orderId);

      if (error) throw error;

      // Optimistic removal — don't wait for the next poll.
      cardEl.classList.add('card-fading');
      setTimeout(() => {
        cardEl.remove();
        const remaining = $('cardGrid').querySelectorAll('.order-card').length;
        if (remaining === 0) {
          $('cardGrid').innerHTML = `<div class="empty-state"><div class="big">✅</div><div class="msg">Nothing overdue right now</div></div>`;
        }
        $('overdueCount').textContent = num(remaining);
      }, 320);
    } catch (e) {
      console.error('Dismiss failed:', e);
      buttons.forEach(b => b.disabled = false);
      alert('Could not update that order — check your connection and try again.');
    }
  }

  $('cardGrid').addEventListener('click', (e) => {
    const noteBtn = e.target.closest('[data-note]');
    if (noteBtn) {
      const wrap = noteBtn.closest('.oc-note-wrap');
      const what = noteBtn.dataset.note;
      if (what === 'edit') openNoteEditor(wrap);
      else if (what === 'cancel') wrap.innerHTML = noteHtml(wrap.dataset.orderId);
      else if (what === 'save') saveNote(wrap);
      return;
    }
    const btn = e.target.closest('.oc-btn');
    if (!btn) return;
    const card = btn.closest('.order-card');
    dismissOrder(btn.dataset.orderId, btn.dataset.action, card);
  });

  updateClock();
  setInterval(updateClock, 30 * 1000);

  load();
  setInterval(load, REFRESH_MS);
})();
</script>

</body>
</html>
